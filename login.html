<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harmony</title>

    <link rel="icon" type="image/x-icon" href="images/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="images/favicon.png?v=2">

    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Ambient background -->

    <div class="aurora" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
        <span class="grain"></span>
    </div>

    <!-- Logo -->

    <a href="index.html" class="logo">

        <span class="logo-mark">
            <img src="images/logo.jpg" alt="Harmony logo">
        </span>

        <span class="logo-name">Harmony</span>

    </a>

    <!-- Auth container -->

    <div class="auth-wrap">

        <div class="auth-container glass">

            <!-- Left / Welcome -->

            <div class="welcome-side">

                <div class="welcome-inner">

                    <span class="eyebrow">
                        <i class="fa-solid fa-bolt"></i>
                        30s previews, zero friction
                    </span>

                    <h1>Welcome Back</h1>

                    <p>
                        From trending hits to timeless classics —
                        log in and dive back into your sound.
                    </p>

                    <div class="disc">

                        <span class="disc-disc">

                            <span class="disc-center">
                                <img src="images/logo.jpg" alt="Harmony logo">
                            </span>

                        </span>

                        <span class="disc-ring"></span>

                    </div>

                    <div class="eq-row" aria-hidden="true">

                        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>

                    </div>

                </div>

            </div>

            <!-- Right Side -->

            <div class="form-side">

                <!-- Toggle -->

                <div class="toggle-buttons" role="tablist">

                    <button id="loginTab" class="active" type="button">Login</button>

                    <button id="signupTab" type="button">Signup</button>

                </div>

                <!-- LOGIN FORM -->

                <form id="loginForm" novalidate>

                    <h2>Sign in to Harmony</h2>

                    <p class="form-sub">Let's pick up where you left off.</p>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email" required>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>

                        <span class="toggle-password">

                            <i class="fa-regular fa-eye"></i>

                        </span>

                    </div>

                    <div class="extra">

                        <span class="hint">Demo login works offline · saved locally</span>

                    </div>

                    <button type="submit" class="submit-btn">

                        <span>Login</span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>

                <!-- SIGNUP FORM -->

                <form id="signupForm" novalidate>

                    <h2>Create your account</h2>

                    <p class="form-sub">Free forever. No credit card needed.</p>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input type="text" id="signupUsername" placeholder="Username" autocomplete="nickname" required>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="signupEmail" placeholder="Email Address" autocomplete="email" required>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="signupPassword" placeholder="Password" autocomplete="new-password" required>

                        <span class="toggle-password">

                            <i class="fa-regular fa-eye"></i>

                        </span>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>

                        <span class="toggle-password">

                            <i class="fa-regular fa-eye"></i>

                        </span>

                    </div>

                    <button type="submit" class="submit-btn">

                        <span>Create Account</span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- Toast -->

    <div id="toast" role="status"></div>

    <script src="login.js"></script>

</body>

</html>
