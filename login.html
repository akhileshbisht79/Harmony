<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harmony | Login</title>

    <link rel="stylesheet" href="css/login.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="blur circle1"></div>
        <div class="blur circle2"></div>
        <div class="blur circle3"></div>

    </div>

    <!-- Logo -->

    <a href="index.html" class="logo">

        <i class="fa-solid fa-headphones-simple"></i>
        Harmony

    </a>

    <!-- Authentication Container -->

    <div class="auth-container">

        <!-- Left Side -->

        <div class="welcome-side">

            <h1>Welcome Back 🎵</h1>

            <p>

                Find Your Perfect Sound
                From trending hits to timeless classics.
                Log in and experience Harmony.
            </p>

            <div class="music-icon">

                <i class="fa-solid fa-compact-disc"></i>

            </div>

        </div>

        <!-- Right Side -->

        <div class="form-side">

            <!-- Toggle -->

            <div class="toggle-buttons">

                <button id="loginTab" class="active">
                    Login
                </button>

                <button id="signupTab">
                    Signup
                </button>

            </div>

            <!-- LOGIN FORM -->

            <form id="loginForm">

                <h2>Login</h2>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" id="loginEmail" placeholder="Email Address" required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="loginPassword" placeholder="Password" required>

                    <span class="toggle-password">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

                <div class="extra">




                </div>

                <button type="submit" class="submit-btn">

                    Login

                </button>

            </form>

            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <h2>Create Account</h2>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input type="text" id="signupUsername" placeholder="Username" required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" id="signupEmail" placeholder="Email Address" required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="signupPassword" placeholder="Password" required>

                    <span class="toggle-password">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                    <span class="toggle-password">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

                <button type="submit" class="submit-btn">

                    Create Account

                </button>

            </form>

        </div>

    </div>

    <!-- Toast Notification -->

    <div id="toast"></div>

    <!-- Footer -->

    <footer>

        © 2026 Harmony Music Streaming
        <br>
        Designed & Developed by Akhil

    </footer>

    <script src="login.js"></script>

</body>

</html>
