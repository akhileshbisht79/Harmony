<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harmony | Music Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/home.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-headphones-simple"></i>

            <span>Harmony</span>

        </div>

        <ul>

            <li class="active" data-target="page-top">
                <i class="fa-solid fa-house"></i>
                Home
            </li>

            <li data-target="trendingSongs">
                <i class="fa-solid fa-fire"></i>
                Trending
            </li>

            <li data-target="recentContainer">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Recent
            </li>

        </ul>

        <button id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div id="page-top"></div>

        <!-- TOP BAR -->

        <header class="topbar" id="topbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" id="searchInput" placeholder="Search Songs, Albums or Artists">

                <button id="searchBtn">

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </div>

            <div class="user">

                <i class="fa-solid fa-user-circle"></i>

                <span id="username">

                    Welcome

                </span>

            </div>

        </header>

        <!-- HERO -->

        <section class="hero" id="hero">

            <div class="hero-text">

                <h1>

                    <span id="heroGreeting">Good Evening</span>,

                    <span id="heroUser">

                        User

                    </span>

                    👋

                </h1>

                <p>

Ready to discover something new? Search, and enjoy instant music previews.

                </p>

                <button id="discoverBtn">

                    Discover Music

                </button>

            </div>

            <div class="hero-image">

                <i class="fa-solid fa-compact-disc"></i>

            </div>

        </section>

        <!-- SEARCH RESULTS -->

        <section class="songs-section">

            <div class="section-title">

                <h2>

                    Search Results

                </h2>

            </div>

            <div class="song-grid" id="songContainer">

            </div>

        </section>

        <!-- TRENDING -->

        <section class="songs-section">

            <div class="section-title">

                <h2>

                    Trending Songs

                </h2>

            </div>

            <div class="song-grid" id="trendingSongs">

            </div>

        </section>

        <!-- RECENTLY PLAYED -->

        <section class="songs-section">

            <div class="section-title">

                <h2>

                    Recently Played

                </h2>

            </div>

            <div class="song-grid" id="recentContainer">

            </div>

        </section>

    </main>

    <!-- Music Player -->

    <footer class="player">

        <div class="player-left">

            <img src="" id="playerImage" alt="Album">

            <div>

                <h4 id="playerSong">

                    No Song Playing

                </h4>

                <p id="playerArtist">

                    Harmony Music

                </p>

            </div>

        </div>

        <div class="player-center">

            <div class="controls">

                <button id="prevBtn">

                    <i class="fa-solid fa-backward-step"></i>

                </button>

                <button id="playBtn">

                    <i class="fa-solid fa-play"></i>

                </button>

                <button id="nextBtn">

                    <i class="fa-solid fa-forward-step"></i>

                </button>

            </div>

            <input type="range" id="progressBar" min="0" max="100" value="0">

        </div>

        <div class="player-right">

            <i class="fa-solid fa-volume-high"></i>

            <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1">

        </div>

    </footer>

    <!-- Hidden Audio -->

    <audio id="audioPlayer"></audio>

    <!-- Loading Spinner -->

    <div id="loader" class="loader">

    </div>

    <!-- Toast -->

    <div id="toast">

    </div>

    <script src="home.js"></script>

</body>

</html>
