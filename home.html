<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harmony</title>

    <link rel="icon" type="image/x-icon" href="images/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="images/favicon.png?v=2">

    <link rel="stylesheet" href="css/home.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Ambient background -->

    <div class="aurora" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
        <span class="grain"></span>
    </div>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">

            <span class="logo-mark">
                <img src="images/logo.jpg" alt="Harmony logo">
            </span>

            <span class="logo-name">Harmony</span>

        </div>

        <ul>

            <li class="active" data-target="page-top">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </li>

            <li data-target="chartsSection">
                <i class="fa-solid fa-chart-simple"></i>
                <span>Charts</span>
            </li>

            <li data-target="recentContainer">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Recent</span>
            </li>

            <li data-target="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search</span>
            </li>

        </ul>

        <div class="side-footer">

            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </button>

        </div>

    </aside>

    <!-- ================= MAIN ================= -->

    <main class="main-content">

        <div id="page-top"></div>

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="search-box">

                <input type="text" id="searchInput" placeholder="Search songs, albums or artists…"
                    autocomplete="off" aria-label="Search songs">

                <button id="searchBtn" aria-label="Search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>

            <div class="user">

                <span class="user-avatar">
                    <i class="fa-solid fa-user"></i>
                </span>

                <span id="username">Welcome</span>

            </div>

        </header>

        <!-- SEARCH VIEW (dedicated search page — same page, player keeps playing) -->

        <section class="search-section view" id="searchView" hidden>

            <div class="section-title">

                <h2>Try Searching</h2>

                <span class="section-count">Quick picks for you</span>

            </div>

            <div class="suggest-list" id="suggestList">

            </div>

            <div class="section-title results-head">

                <h2>Search Results</h2>

                <span class="section-count" id="searchCount">0 tracks</span>

            </div>

            <div class="song-list" id="songContainer">

            </div>

        </section>

        <!-- HERO -->

        <section class="hero view" id="hero">

            <div class="hero-blob" aria-hidden="true"></div>

            <div class="hero-head">

                <div class="hero-title">

                    <span class="eyebrow">
                        <i class="fa-solid fa-fire"></i>
                        Trending now
                    </span>

                    <h1>What the world is listening to</h1>

                </div>

            </div>

            <div class="hero-marquee">

                <div class="hero-track" id="heroTrack"></div>

            </div>

        </section>

        <!-- CHARTS -->

        <section class="songs-section view" id="chartsSection">

            <div class="section-title">

                <h2>Top Charts</h2>

                <span class="section-chips">

                    <span class="chip"><i class="fa-solid fa-chart-simple"></i> Live Top 50</span>

                </span>

            </div>

            <div class="chart-grid" id="chartGrid">

            </div>

            <!-- Expanded chart list (shown when a chart is clicked) -->

            <div class="chart-panel-inline" id="chartPanelInline" hidden>

                <div class="chart-head">

                    <span class="chart-badge" id="chartBadge">

                        <i class="fa-solid fa-chart-simple"></i> Top 50

                    </span>

                    <button class="chart-close" id="chartClose" aria-label="Close chart">

                        <i class="fa-solid fa-xmark"></i>

                    </button>

                </div>

                <div class="chart-copy">

                    <h3 id="chartTitle">Top 50</h3>

                    <p id="chartSub">Live chart</p>

                </div>

                <div class="chart-list" id="chartList">

                </div>

            </div>

        </section>

        <!-- RECENTLY PLAYED -->

        <section class="songs-section view" id="recentSection">

            <div class="section-title">

                <h2>Recently Played</h2>

                <button class="text-btn" id="clearRecentBtn">

                    <i class="fa-solid fa-broom"></i>

                    Clear history

                </button>

            </div>

            <div class="song-grid" id="recentContainer">

            </div>

        </section>

    </main>

    <!-- ================= MUSIC PLAYER ================= -->

    <footer class="player" id="player">

        <div class="player-left">

            <div class="artwork">

                <img src="" id="playerImage" alt="Album artwork">

            </div>

            <div class="track-meta">

                <h4 id="playerSong">Nothing playing</h4>

                <p id="playerArtist">Harmony — preview player</p>

            </div>

        </div>

        <div class="player-center">

            <div class="controls">

                <button id="prevBtn" aria-label="Previous">

                    <i class="fa-solid fa-backward-step"></i>

                </button>

                <button id="playBtn" aria-label="Play or pause">

                    <i class="fa-solid fa-play"></i>

                </button>

                <button id="nextBtn" aria-label="Next">

                    <i class="fa-solid fa-forward-step"></i>

                </button>

            </div>

            <div class="progress-row">

                <span id="curTime">0:00</span>

                <input type="range" id="progressBar" min="0" max="100" value="0" aria-label="Seek">

                <span id="durTime">0:30</span>

            </div>

        </div>

        <div class="player-right">

            <i class="fa-solid fa-volume-high" aria-hidden="true"></i>

            <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1" aria-label="Volume">

        </div>

    </footer>

    <!-- Hidden audio element -->

    <audio id="audioPlayer"></audio>

    <!-- Loading overlay -->

    <div id="loader" class="loader" role="status" aria-label="Loading">

        <div class="loader-disc">
            <img src="images/logo.jpg" alt="Harmony logo">
        </div>

        <p>Tuning in…</p>

    </div>

    <!-- Toast -->

    <div id="toast" role="status"></div>

    <script src="home.js"></script>

</body>

</html>
